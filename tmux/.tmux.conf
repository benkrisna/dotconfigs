set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Let kitty-graphics-protocol escape sequences (used by image.nvim/molten
# for inline plots) pass through tmux to Ghostty instead of being eaten.
set -g allow-passthrough on
set -g visual-activity off
set -as terminal-features ",xterm-256color:RGB"

# Forward focus in/out events on tmux window switches so Neovim's
# FocusLost/FocusGained fire (image.nvim uses these to hide/show inline
# plots when you leave/return to this tmux window).
set -g focus-events on
set -g @plugin 'tmux-plugins/tmux-resurrect'

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

run-shell ~/.tmux/tmux-resurrect/resurrect.tmux

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'latte' # or frappe, macchiato, mocha

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Do vim-like binding
# vim-like pane resizing
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# and now unbind keys
unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

set-option -g allow-rename off

set-option -g default-shell /bin/zsh
